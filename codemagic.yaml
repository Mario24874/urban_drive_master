workflows:
  ios-capacitor-build:
    name: Urban Drive - iOS build (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      # Conecta tu cuenta de Apple Developer desde Codemagic UI
      # (Teams > Integrations > Apple Developer Portal) y descomenta:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.urbandrive.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      # --- Build sin firma: valida que compila (usar mientras no haya
      # certificados configurados en Codemagic) ---
      - name: Build (unsigned, verificación de compilación)
        script: |
          xcodebuild build \
            -workspace $XCODE_WORKSPACE \
            -scheme $XCODE_SCHEME \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
      # --- Descomentar cuando la integración de Apple Developer esté
      # configurada en Codemagic (Teams > Integrations) para generar un
      # IPA firmado y subirlo a TestFlight ---
      # - name: Set up code signing
      #   script: |
      #     keychain initialize
      #     app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
      #     keychain add-certificates
      #     xcode-project use-profiles
      # - name: Archive and export IPA
      #   script: |
      #     xcode-project build-ipa \
      #       --workspace "$XCODE_WORKSPACE" \
      #       --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - marioivanmorenopineda@gmail.com
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
