server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

    # Cache static assets aggressively (Vite adds content hash to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker — never cache it so updates propagate immediately
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA manifest — short cache
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Proxy de Mapbox: redes como Starlink bloquean/degradan api.mapbox.com,
    # así que estilos, tiles, glyphs y sprites se sirven vía este dominio.
    # proxy_pass con variable para re-resolver la IP del CDN de Mapbox (rota).
    location ~ ^/mapbox-api/(.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $mapbox_upstream "api.mapbox.com";
        proxy_pass https://$mapbox_upstream/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mapbox.com;
        proxy_buffering on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # Tiles y estilos versionados: cache corto en el navegador
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
        # Permite que el popup de OAuth (Google/Apple) se comunique con la app.
        # Sin esto el navegador bloquea la lectura de window.closed del popup
        # ("Cross-Origin-Opener-Policy policy would block the window.closed call").
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
